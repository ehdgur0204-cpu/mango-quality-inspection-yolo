# 초기 YOLO 학습 설정 예시 파일입니다.
# 실제 학습 시 필요하다면 복사해서 별도 설정 파일을 만들어 사용하세요.

model: yolov8n.pt   # 사용할 사전학습 가중치 (nano 모델, 가장 가벼움)
epochs: 50           # 전체 학습 반복 횟수
imgsz: 640           # 입력 이미지 크기 (정사각형 640x640으로 리사이즈)
batch: 16            # 배치 크기 (한 번에 학습에 사용하는 이미지 수)
seed: 42             # 재현성을 위한 랜덤 시드
device: 0            # 학습에 사용할 장치 (0 = 첫 번째 GPU, GPU가 없으면 "cpu"로 변경)
workers: 4           # 데이터 로딩에 사용할 워커(프로세스) 수
